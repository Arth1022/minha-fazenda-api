name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      # Mesmo Postgres do docker-compose.yml; é contra ele que o liquibase:diff compara as Entities
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: minhafazenda
          POSTGRES_USER: minhafazenda
          POSTGRES_PASSWORD: minhafazenda
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U minhafazenda -d minhafazenda"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Testes (Testcontainers) e contrato de schema
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Aplica o Liquibase no Postgres do job
        run: ./mvnw -B liquibase:update

      - name: Falha se as Entities tiverem mudança sem changeset commitado
        run: |
          ./mvnw -B liquibase:diff -Dliquibase.diffChangeLogFile=target/diff-nao-commitado.yaml
          if grep -q "changeSet" target/diff-nao-commitado.yaml 2>/dev/null; then
            echo "As Entities divergem do changelog. Rode ./mvnw liquibase:diff e commite o changeset:"
            cat target/diff-nao-commitado.yaml
            exit 1
          fi

      - name: Publica as colunas do banco para o front
        uses: actions/upload-artifact@v4
        with:
          name: schema-colunas
          path: contracts/schema-colunas.json
          if-no-files-found: error
