spring:
  application:
    name: MinhaFazenda
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      # Margem acima do maior limite (áudio, 20 MB) para o limite ser respondido pela API
      # no formato do contrato; cada rota confere o próprio limite (avatar 5 MB, foto 10 MB)
      max-file-size: 21MB
      max-request-size: 22MB

jwt:
  private-key: ${JWT_PRIVATE_KEY}
  kid: ${JWT_KID}
  access-minutos: 30
  # TODO(decisao): validade do refresh token
  refresh-dias: 90
  powersync-minutos: 60
  cache-sessao-segundos: 30
  permitir-chave-efemera: false

powersync:
  url: ${POWERSYNC_URL}

storage:
  endpoint: ${STORAGE_ENDPOINT}
  region: ${STORAGE_REGION}
  key: ${STORAGE_KEY}
  secret: ${STORAGE_SECRET}
  bucket: ${STORAGE_BUCKET:avatars}
  public-url: ${STORAGE_PUBLIC_URL}

midia:
  # Bucket privado das fotos, áudios e documentos das fazendas (criado pelo changeset SC-047)
  bucket: ${STORAGE_BUCKET_MIDIAS:midias}
  validade-url-minutos: 60

convite:
  link-base: ${APP_LINK_BASE}
  validade-horas: 48
  usos-max: 1

sync:
  min-schema-version: ${SYNC_MIN_SCHEMA_VERSION:1}
  # Tabelas de domínio que o app pode escrever (schema v1 do app)
  tabelas:
    - fazenda_config
    - lotes
    - animais
    - pesagens
    - reproducoes
    - tratamentos
    - doses_aplicadas
    - avaliacoes_corporais
    - controles_leiteiros
    - secagens
    - mastites
    - cios
    - exames
    - anotacoes_animal
    - ordenhas
    - maquinas
    - usos_maquina
    - paradas_uso
    - abastecimentos
    - leituras_horimetro
    - ocorrencias_maquina
    - anotacoes_maquina
    - talhoes
    - marcadores_mapa
    - movimentacoes
    - calculos_cerca
    - modelos_cultura
    - ciclos_plantio
    - etapas_ciclo
    - usos_area
    - tarefas
    - tarefa_eventos

permissoes:
  # TODO(decisao): collaborator pode apagar registros
  collaborator-pode-apagar: true

rate-limit:
  requisicoes-por-minuto: 10
