# Valores locais de desenvolvimento; nenhum deles é segredo de produção.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:54322/minhafazenda}
    username: ${DB_USER:minhafazenda}
    password: ${DB_PASS:minhafazenda}

jwt:
  private-key: ${JWT_PRIVATE_KEY:}
  kid: ${JWT_KID:dev}
  # Sem JWT_PRIVATE_KEY, a API gera um par RSA a cada subida
  permitir-chave-efemera: true

powersync:
  url: ${POWERSYNC_URL:http://localhost:8081}

storage:
  endpoint: ${STORAGE_ENDPOINT:http://127.0.0.1:54321/storage/v1/s3}
  region: ${STORAGE_REGION:local}
  key: ${STORAGE_KEY:dev}
  secret: ${STORAGE_SECRET:dev}
  public-url: ${STORAGE_PUBLIC_URL:http://127.0.0.1:54321/storage/v1/object/public/avatars}

convite:
  link-base: ${APP_LINK_BASE:minhafazenda://app}
