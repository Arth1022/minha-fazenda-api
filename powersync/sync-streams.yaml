# Sync Streams do PowerSync. Cada usuário recebe só os dados das fazendas em que é membro ativo:
# todo stream filtra por fazenda_membros com removed_at IS NULL. auth.user_id() é o sub do JWT
# emitido em GET /auth/powersync-token.
# Tabela de domínio nova = um bloco novo no fim, igual aos de baixo.
config:
  edition: 3

streams:
  fazendas:
    auto_subscribe: true
    query: |
      SELECT * FROM fazendas WHERE id IN (
        SELECT fazenda_id FROM fazenda_membros
        WHERE usuario_id = auth.user_id() AND removed_at IS NULL)

  membros:
    auto_subscribe: true
    query: |
      SELECT * FROM fazenda_membros WHERE fazenda_id IN (
        SELECT fazenda_id FROM fazenda_membros
        WHERE usuario_id = auth.user_id() AND removed_at IS NULL)

  # Só id, nome e avatar dos colegas de fazenda; e-mail e telefone nunca saem do servidor.
  colegas:
    auto_subscribe: true
    query: |
      SELECT id, nome, avatar_url FROM usuarios WHERE id IN (
        SELECT usuario_id FROM fazenda_membros WHERE fazenda_id IN (
          SELECT fazenda_id FROM fazenda_membros
          WHERE usuario_id = auth.user_id() AND removed_at IS NULL))

  # Tabelas de domínio (schema v1 do app)
